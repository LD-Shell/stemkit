        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-max max-w-[calc(100vw-2rem)] bg-white/70 dark:bg-slate-900/70 backdrop-blur-md px-4 sm:px-6 py-3 rounded-full shadow-2xl border border-white/20 dark:border-slate-700/50 flex items-center gap-4 sm:gap-6 pointer-events-auto z-10">
            <span class="text-sm font-bold text-slate-600 dark:text-slate-300"><span class="sb-hint-pointer">Move to push, hold to gather</span><span class="sb-hint-touch">Drag to gather, lift to scatter</span></span>
